name: ODH map UI tests

on:
  push:
    paths:
      - 'odh-map/**'
      - 'districts/**'
      - 'object-maps/**'
      - 'review-cabinet/**'
      - 'index.html'
      - 'sao-exports.js'
      - 'atlas-*.css'
      - 'atlas-*.js'
      - '.github/workflows/odh-map-ui.yml'
  pull_request:
    paths:
      - 'odh-map/**'
      - 'districts/**'
      - 'object-maps/**'
      - 'review-cabinet/**'
      - 'index.html'
      - 'sao-exports.js'
      - 'atlas-*.css'
      - 'atlas-*.js'
      - '.github/workflows/odh-map-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odh-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: odh-map/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
