name: Playground photo PostgreSQL integration
on:
  pull_request:
    paths:
      - 'photo-service/**'
      - 'districts/layers/**'
      - '.github/workflows/playground-postgres-integration.yml'
  push:
    branches:
      - 'codex/playground-photo-layer-prep-20261027'
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playground_test
          POSTGRES_PASSWORD: playground_test
          POSTGRES_DB: playground_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playground_test -d playground_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAYGROUND_DISPOSABLE_DB: 'yes'
      PHOTO_SERVICE_DB_HOST: 127.0.0.1
      PHOTO_SERVICE_DB_PORT: '5432'
      PHOTO_SERVICE_DB_NAME: playground_test
      PHOTO_SERVICE_DB_USER: playground_test
      PHOTO_SERVICE_DB_PASSWORD: playground_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: photo-service/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: photo-service
      - run: node scripts/test-playground-postgres.mjs
        working-directory: photo-service
