name: SMM overlay & atlas checks

on:
  push:
    branches: [main]
    paths:
      - 'smm/**'
      - 'smm.geojson'
      - 'smm_routes.geojson'
      - 'work/smm_tracks/**'
      - 'work/build_smm_routes_overlay.py'
      - 'work/build_smm_print_a3.py'
      - 'tests/**'
      - 'index.html'
      - 'hub/**'
      - '.github/workflows/**'
  pull_request:

jobs:
  checks:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run atlas tests
        run: python -m pytest tests -q

  regenerate:
    name: Rebuild overlay & print form
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Regenerate smm_routes.geojson and print-a3.html
        run: |
          python work/build_smm_routes_overlay.py
          python work/build_smm_print_a3.py
      - name: Detect changes
        id: changed
        run: |
          if ! git diff --exit-code -- smm_routes.geojson smm/print-a3.html >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit regenerated artifacts
        if: steps.changed.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smm_routes.geojson smm/print-a3.html
          git commit -m "chore: regenerate SMM overlay and print form from tracks"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main