# Include this location inside the existing TLS server for obhod-sao.ru.
# The static map uses https://obhod-sao.ru/odh-api as its API base URL.
location /odh-api/ {
    resolver 127.0.0.11 valid=10s;
    set $odh_api_upstream odh-sao-api:8787;
    rewrite ^/odh-api/(.*)$ /$1 break;
    proxy_pass http://$odh_api_upstream$uri$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
