services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odh_sao}
      POSTGRES_USER: ${POSTGRES_USER:-odh_sao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - odh_sao_postgres:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8787
      # Отчёты и рассылки печатают дату и время по московскому времени.
      TZ: ${TZ:-Europe/Moscow}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-odh_sao}
      PGUSER: ${POSTGRES_USER:-odh_sao}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://hainox.github.io}
      NOTIFY_URL: ${NOTIFY_URL:-http://notify:8790}
      NOTIFY_SECRET: ${NOTIFY_SECRET:-}
      # Отчёт о состоянии отрисовки маршрутов ОДХ в Telegram раз в 3 часа.
      ODH_ROUTE_REPORT_ENABLED: ${ODH_ROUTE_REPORT_ENABLED:-false}
    networks:
      default: {}
      edge:
        aliases:
          - odh-sao-api
  notify:
    build:
      context: .
      dockerfile: notify/Dockerfile
    # DNS отдаёт для api.telegram.org только IPv6, а исходящего IPv6 у хоста нет,
    # и разрешённый по IPv4 адрес тоже недоступен. Закрепляем проверенный рабочий.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Отчёты и журнал живут по московскому времени.
      TZ: ${TZ:-Europe/Moscow}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN from @BotFather in .env}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:?Set TELEGRAM_CHAT_IDS in .env}
      NOTIFY_SECRET: ${NOTIFY_SECRET:?Set NOTIFY_SECRET in .env}
      NOTIFY_PORT: 8790
      NOTIFY_DATA_DIR: /srv/notify/data
      ODH_API_URL: ${ODH_API_URL:-http://api:8787}
      ODH_PREFECTURE_LOGIN: ${ODH_PREFECTURE_LOGIN:-}
      ODH_PREFECTURE_PASSWORD: ${ODH_PREFECTURE_PASSWORD:-}
    volumes:
      - notify_data:/srv/notify/data
    networks:
      default: {}
      edge:
        aliases:
          - sao-notify
      photoservice:
        aliases:
          - sao-notify
volumes:
  odh_sao_postgres:
  notify_data:
networks:
  edge:
    name: ${EDGE_NETWORK:-jirajura_default}
    external: true
  photoservice:
    name: ${PHOTO_SERVICE_EDGE_NETWORK:-sao-photo-service-edge}
    external: true
