<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оцифровка ДП/СП и МАФ · САО</title><link rel="stylesheet" href="../dp-sp-cabinet/cabinet.css?v=20261119-district"></head>
<body data-review="false">
<div class="login" id="login" hidden><form id="loginForm"><h2>Кабинет оцифровки</h2><p>Войдите по выданному логину и паролю.</p><div class="field"><label for="email">Логин</label><input id="email" required autocomplete="username"></div><div class="field"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"></div><p><button class="btn primary">Войти</button></p><div class="notice" id="loginMsg" role="status"></div></form></div>
<header class="top" id="top" hidden><div><h1>Оцифровка ДП/СП и МАФ · САО</h1><p id="userLine"></p></div><details class="account-menu"><summary>Кабинет</summary><div class="account-options"><a class="navlink" id="reviewLink" href="../dp-sp-review/">К приёмке →</a><button id="logout" type="button">Выйти</button></div></details></header>
<main class="app" id="main" hidden>

<section class="filters"><div class="field"><label for="district">Район</label><select id="district"><option value="">Все районы</option></select></div><div class="field"><label for="kind">Вид площадки</label><select id="kind"><option value="">ДП и СП</option><option value="dp">Детские</option><option value="sp">Спортивные</option></select></div><button class="sync" id="refresh">Обновить</button></section>
<div class="summary"><span class="chip"><b id="queueCount">0</b> осталось отработать</span><span id="message" class="chip" role="status"></span></div>
<section class="layout"><aside class="queue"><div class="queue-head"><strong>Площадки для оцифровки</strong></div><div id="queue" class="queue-list"></div></aside><article id="detail" class="detail"><div class="empty">Выберите площадку</div></article></section></main>
<dialog id="viewer"><button type="button" class="btn" id="closeViewer">Закрыть фото</button><img id="largePhoto" alt="Фотография полностью"></dialog>
<template id="siteMapTemplate">
  <section class="site-map" aria-label="Место съёмки">
    <div class="site-map-head">
      <strong>Место съёмки</strong>
    </div>
    <label class="field map-photo-select" hidden><span>Снимок на карте</span><select></select></label>
    <div hidden>
      <button type="button" data-map="open" disabled></button>
      <button type="button" data-map="back"></button>
      <span data-map="arrow"></span><span data-map="bearing"></span><span data-map="detail"></span>
      <div data-map="pano"></div>
    </div>
    <div class="site-map-canvas" data-map="map" aria-label="Карта площадки"></div>
    <p class="sub map-photo-location" role="status"></p>
    <p class="sub" data-map="status" role="status">Загружаем мини-карту…</p>
  </section>
</template>
<dialog id="camera" aria-labelledby="cameraTitle">
  <h2 id="cameraTitle"></h2>
  <video id="cameraPreview" autoplay playsinline muted aria-label="Изображение с камеры"></video>
  <p id="cameraStatus" role="status"></p>
  <div class="buttons">
    <button type="button" class="btn" id="cameraCancel" autofocus>Отмена</button>
    <button type="button" class="btn primary" id="cameraSnap" disabled>Сделать снимок</button>
  </div>
</dialog>
<script src="../dp-sp-cabinet/cabinet.js?v=20261119-district"></script></body></html>
