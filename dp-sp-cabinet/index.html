<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кабинет оцифровки ДП/СП и МАФ · САО</title>
<style>
:root{--ink:#18352e;--muted:#6d7e77;--line:#dce7e0;--paper:#f4f7f4;--panel:#fff;--brand:#0c735b;--brand-soft:#e7f4ee;--warn:#a75022;--warn-soft:#fff0e7;--shadow:0 12px 34px #163b3020}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}
.top{min-height:72px;background:#123d33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 28px;gap:10px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0}
.top p{margin:3px 0 0;color:#c6ddd4;font-size:12px}
.top button{border:1px solid #b9ddd0;background:#dcefe7;color:#164b3e;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}
.app{max-width:1480px;margin:auto;padding:22px}
.login{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow)}
.login h2{margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin:0 0 5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #cbd8cf;border-radius:8px;background:#fff;padding:10px;color:var(--ink)}
.notice{color:var(--warn);min-height:18px;font-size:12px;margin-top:6px}
.filters{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);align-items:end}
.sync{height:42px;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:0 15px;font-weight:700;cursor:pointer}
.sync:disabled{opacity:.6;cursor:wait}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted);font-size:12px}
.chip b{color:var(--ink);margin-right:4px}
.layout{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:14px;align-items:start}
@media(max-width:920px){.layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}}
.queue,.detail{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.queue-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.queue-list{max-height:720px;overflow:auto;padding:8px}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:#fff;border-radius:10px;padding:11px 12px;margin:2px 0;cursor:pointer;font:inherit}
.item:hover{border-color:var(--line)}
.item.active{border-color:var(--brand);background:var(--brand-soft)}
.item strong{display:block;font-size:13px}
.item small{color:var(--muted);display:block;margin-top:3px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:700;margin-top:6px;background:#eef2f0;color:var(--muted)}
.badge.ok{background:var(--brand-soft);color:var(--brand)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:26px;color:var(--muted);text-align:center}
.detail{padding:18px}
.detail h2{margin:0;font-size:18px}
.sub{color:var(--muted);margin:4px 0 12px;font-size:12px}
.site-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.site-meta div{background:#fbfdfb;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.site-meta span{display:block;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.site-meta b{font-size:13px}
.site-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.btn{border:1px solid #cbd8cf;background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{background:var(--warn-soft);border-color:#e8c4a8;color:var(--warn)}
.btn.mini{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.6;cursor:wait}
.checked-note{font-size:12px;color:var(--muted);margin-top:4px}
h3.section{margin:18px 0 8px;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px}
.maf-item{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px;background:#fbfdfb}
.maf-photo{flex:0 0 96px;width:96px;height:96px;border-radius:8px;object-fit:cover;background:#eef2f0;border:1px solid var(--line)}
.maf-photo.placeholder{display:grid;place-items:center;color:#b6c4be;font-size:10px;text-align:center}
.maf-body{flex:1;min-width:0}
.maf-body b{font-size:13.5px}
.maf-body .meta{color:var(--muted);font-size:12px;margin-top:2px}
.maf-body .comment{font-size:12px;margin-top:4px;color:var(--ink);white-space:pre-wrap}
.maf-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cond{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700}
.cond.ok{background:var(--brand-soft);color:var(--brand)}
.cond.repair{background:#fff6d6;color:#8a6d00}
.cond.broken{background:var(--warn-soft);color:var(--warn)}
.maf-form{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;display:grid;grid-template-columns:2fr 80px 1fr 2fr auto;gap:8px;align-items:end}
@media(max-width:920px){.maf-form{grid-template-columns:1fr 1fr}}
.save-state{color:var(--muted);font-size:12px;min-height:18px;margin-top:8px}
.save-state.err{color:var(--warn)}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <h2>Кабинет оцифровки</h2>
    <p>ДП/СП и МАФ САО. Доступ только для префектуры.</p>
    <div class="field"><label for="email">Логин</label><input id="email" required autocomplete="username"></div>
    <div class="field"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%">Войти</button>
    <div class="notice" id="loginMsg"></div>
  </form>
</div>
<header class="top" id="top" hidden>
  <div><h1>Оцифровка ДП/СП и МАФ · САО</h1><p id="userLine"></p></div>
  <div><button id="refresh" type="button">Обновить</button> <button id="logout" type="button">Выйти</button></div>
</header>
<main class="app" id="main" hidden>
  <section class="filters">
    <div class="field"><label for="district">Район</label><select id="district"><option value="">Все районы</option></select></div>
    <div class="field"><label for="kind">Вид</label><select id="kind"><option value="">Все виды</option><option value="dp">ДП</option><option value="sp">СП</option></select></div>
    <div class="field"><label for="status">Статус</label><select id="status"><option value="">Все</option><option value="unchecked">Не оцифровано</option><option value="checked">Оцифровано</option><option value="maf">С МАФ</option><option value="no_maf">Без МАФ</option></select></div>
    <div class="field"><label for="search">Поиск</label><input id="search" placeholder="Адрес или ID площадки"></div>
    <button class="sync" id="apply" type="button">Показать</button>
  </section>
  <div class="summary">
    <span class="chip"><b id="sumSites">0</b>площадок</span>
    <span class="chip"><b id="sumChecked">0</b>оцифровано</span>
    <span class="chip"><b id="sumMaf">0</b>МАФ найдено</span>
    <span class="chip"><b id="sumPhotos">0</b>фото МАФ</span>
    <span class="chip" id="saveState">Статус сохраняется сразу</span>
  </div>
  <section class="layout">
    <aside class="queue">
      <div class="queue-head"><strong>Площадки</strong><span id="queueCount">0</span></div>
      <div class="queue-list" id="queue"><div class="empty">Выберите район или нажмите «Показать»</div></div>
    </aside>
    <article class="detail" id="detail"><div class="empty">Выберите площадку слева</div></article>
  </section>
</main>
<script>
const API=(new URLSearchParams(location.search).get('api')||localStorage.getItem('saoPhotoApi')||'https://obhod-sao.ru/photo-api').replace(/\/$/,'');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=localStorage.getItem('saoPhotoToken')||'',sites=[],current=null;
const kindName=k=>k==='dp'?'Детская площадка':'Спортивная площадка';
const stateName=s=>({accepted:'Фото принято',pending:'На проверке',rework:'На доработке',empty:'Нет фото'}[s]||'Нет фото');
const conditionBadge=c=>({ok:'ok',repair:'repair',broken:'broken'}[c]||'ok');
function headers(extra={}){return token?Object.assign({'Authorization':'Bearer '+token},extra):extra}
async function api(path,opts={}){
  const r=await fetch(API+path,Object.assign({credentials:'include'},opts,{headers:headers(opts.headers||{})}));
  if(r.status===401){token='';localStorage.removeItem('saoPhotoToken');showLogin('Сессия истекла, войдите снова.');throw Error('Сессия истекла')}
  if(r.status===403)throw Error('Доступ только для префектуры.');
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.message||d.error||'Не удалось выполнить запрос');
  return d;
}
function showLogin(message){
  $('login').hidden=false;$('top').hidden=true;$('main').hidden=true;
  if(message)$('loginMsg').textContent=message;
}
function showApp(user){
  $('login').hidden=true;$('top').hidden=false;$('main').hidden=false;
  $('userLine').textContent=(user.displayName||user.email||'')+' · Префектура · ДП/СП';
}
async function login(e){
  e.preventDefault();$('loginMsg').textContent='Выполняется вход…';
  try{
    const d=await fetch(API+'/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({login:$('email').value,email:$('email').value,password:$('password').value})})
      .then(r=>r.json());
    if(!d.token)throw Error(d.message||d.error||'Не удалось войти');
    token=d.token;localStorage.setItem('saoPhotoToken',token);localStorage.setItem('saoPhotoApi',API);
    showApp(d.user||{});await refresh();
  }catch(x){$('loginMsg').textContent=x.message}
}
function logout(){token='';localStorage.removeItem('saoPhotoToken');showLogin()}
async function loadSummary(){
  const d=await api('/object-photo-points/dpsp/summary');
  $('sumSites').textContent=d.totals.sites;$('sumChecked').textContent=d.totals.checked;
  $('sumMaf').textContent=d.totals.maf;$('sumPhotos').textContent=d.totals.photos;
  const prev=$('district').value;
  $('district').innerHTML='<option value="">Все районы</option>'+d.districts.map(x=>`<option value="${esc(x.district)}">${esc(x.district)}</option>`).join('');
  if([...$('district').options].some(o=>o.value===prev))$('district').value=prev;
}
async function loadDictionaries(){
  if(dictionaries)return;
  try{dictionaries=await api('/object-photo-points/dpsp/dictionaries')}catch{dictionaries=dictionaries||{types:[]}}
}
async function loadSites(silent=false){
  if(!silent)$('saveState').className='chip';if(!silent)$('saveState').textContent='Загружаем площадки…';
  const q=new URLSearchParams();
  if($('district').value)q.set('district',$('district').value);
  if($('kind').value)q.set('kind',$('kind').value);
  if($('status').value)q.set('status',$('status').value);
  const text=$('search').value.trim();if(text)q.set('q',text);
  const d=await api('/object-photo-points/dpsp/sites?'+q);
  sites=d.sites||[];renderQueue();
  if(!silent)$('saveState').textContent='Статус сохраняется сразу';
}
async function refresh(){
  await Promise.all([loadSummary(),loadDictionaries(),loadSites()]);
  if(current)openSite(current.point_id,true);
}
function renderQueue(){
  $('queueCount').textContent=sites.length;
  $('queue').innerHTML=sites.length?sites.map(s=>{
    const flags=[s.checked_at?'<span class="badge ok">Оцифровано</span>':'<span class="badge">Не оцифровано</span>'];
    if(s.maf_count>0)flags.push(`<span class="badge ok">МАФ: ${s.maf_count}</span>`);
    if(s.photo_state==='accepted')flags.push('<span class="badge ok">Фото ✓</span>');
    return `<button class="item ${current&&current.point_id===s.point_id?'active':''}" data-id="${esc(s.point_id)}"><strong>${esc(s.address||'ID '+s.source_id)}</strong><small>${esc(s.district)} · ${kindName(s.kind)} · ${esc(s.source_id)}</small>${flags.join('')}</button>`;
  }).join(''):'<div class="empty">Площадок по фильтру нет</div>';
  document.querySelectorAll('.item').forEach(b=>b.onclick=()=>openSite(b.dataset.id));
}
async function openSite(id,silent=false){
  try{
    const d=await api('/object-photo-points/dpsp/sites/'+id);
    current=d.site;renderDetail(d);
  }catch(x){if(!silent){$('saveState').className='chip err';$('saveState').textContent=x.message}}
}
function renderDetail(d){
  const s=d.site,mapUrl=s.district_slug?`https://hainox.github.io/karta-sao/districts/${s.district_slug}.html?playground=${encodeURIComponent(s.point_id)}`:null;
  const types=dictionaries||{types:[]};
  $('detail').innerHTML=`
  <h2>${esc(s.address||'ID '+s.source_id)}</h2>
  <p class="sub">${esc(s.district)} · ${kindName(s.kind)} · ID ${esc(s.source_id)} · ${stateName(s.photo_state)}</p>
  <div class="site-meta">
    <div><span>МАФ найдено</span><b>${s.maf_count}</b></div>
    <div><span>Оцифровано</span><b>${s.checked_at?new Date(s.checked_at).toLocaleString('ru-RU'):'—'}</b></div>
    <div><span>Координаты</span><b>${s.latitude.toFixed(6)}, ${s.longitude.toFixed(6)}</b></div>
  </div>
  <div class="site-actions">
    <button class="btn ${s.checked_at?'':'primary'}" id="checkBtn">${s.checked_at?'Снять отметку «Оцифровано»':'Отметить «Оцифровано»'}</button>
    ${mapUrl?`<a class="btn" href="${esc(mapUrl)}" target="_blank" rel="noopener">Открыть на карте района</a>`:''}
  </div>
  ${s.checked_at&&s.checked_comment?`<div class="checked-note">Комментарий: ${esc(s.checked_comment)}</div>`:''}
  <h3 class="section">МАФ на площадке (${d.items.length})</h3>
  <div id="mafList">${d.items.length?d.items.map(item=>mafCard(item)).join(''):'<div class="empty">МАФ не записаны</div>'}</div>
  <h3 class="section">Добавить МАФ</h3>
  <form class="maf-form" id="mafForm">
    <div class="field"><label>Тип</label><select id="mafType">${typeOptions(types)}</select></div>
    <div class="field"><label>Кол-во</label><input id="mafQty" type="number" min="1" max="999" value="1"></div>
    <div class="field"><label>Состояние</label><select id="mafCond"><option value="ok">Исправно</option><option value="repair">Требует ремонта</option><option value="broken">Неисправно</option></select></div>
    <div class="field"><label>Комментарий</label><input id="mafComment" maxlength="2000"></div>
    <div class="field"><label>Фото (необязательно)</label><input id="mafPhoto" type="file" accept="image/jpeg,image/png,image/webp"></div>
    <button class="btn primary" type="submit">Добавить</button>
  </form>
  <div class="save-state" id="detailState"></div>`;
  $('checkBtn').onclick=()=>toggleCheck(!s.checked_at);
  $('mafForm').onsubmit=addMaf;
  bindItemActions(d.items);
}
let dictionaries=null;
const thumbUrl=t=>t?`${API}/object-photo-points/dpsp/photo-thumb/${t}.jpg`:'';
function mafCard(item){
  return `<div class="maf-item" data-maf="${esc(item.id)}">
    ${item.photo_token?`<img class="maf-photo" src="${esc(thumbUrl(item.photo_token))}" alt="Фото МАФ">`:'<div class="maf-photo placeholder">нет фото</div>'}
    <div class="maf-body">
      <b>${esc(item.type_label)}</b> × ${esc(item.quantity)}
      <div class="meta"><span class="cond ${conditionBadge(item.condition)}">${esc(item.condition_label)}</span> · обновлено ${item.updated_at?new Date(item.updated_at).toLocaleString('ru-RU'):'—'}</div>
      ${item.comment?`<div class="comment">${esc(item.comment)}</div>`:''}
      <div class="maf-actions">
        <label class="btn mini">Фото<input type="file" accept="image/jpeg,image/png,image/webp" hidden data-photo="${esc(item.id)}"></label>
        <button class="btn mini" data-edit="${esc(item.id)}">Изменить</button>
        <button class="btn mini danger" data-delete="${esc(item.id)}">Удалить</button>
      </div>
      <div class="edit-slot" data-edit-slot="${esc(item.id)}"></div>
    </div>
  </div>`;
}
function typeOptions(types){
  const dp=types.types.filter(t=>t.kind==='dp'),sp=types.types.filter(t=>t.kind==='sp'),any=types.types.filter(t=>!t.kind);
  const opt=t=>`<option value="${esc(t.code)}">${esc(t.label)}</option>`;
  return (dp.length?`<optgroup label="Детские площадки">${dp.map(opt).join('')}</optgroup>`:'')
    +(sp.length?`<optgroup label="Спортивные площадки">${sp.map(opt).join('')}</optgroup>`:'')
    +(any.length?`<optgroup label="Общее">${any.map(opt).join('')}</optgroup>`:'');
}
function bindItemActions(items){
  document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMaf(b.dataset.delete));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editMaf(items.find(i=>i.id===b.dataset.edit)));
  document.querySelectorAll('[data-photo]').forEach(input=>input.onchange=()=>uploadPhoto(input.dataset.photo,input.files[0]));
}
async function toggleCheck(checked){
  $('detailState').textContent='Сохраняем…';
  try{
    await api(`/object-photo-points/dpsp/sites/${current.point_id}/check`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({checked})});
    await refresh();$('detailState').textContent=checked?'Отмечено как оцифрованное':'Отметка снята';
  }catch(x){$('detailState').textContent=x.message;$('detailState').className='save-state err'}
}
async function addMaf(e){
  e.preventDefault();$('detailState').textContent='Сохраняем…';
  try{
    const body={type_code:$('mafType').value,quantity:Number($('mafQty').value||1),condition:$('mafCond').value,comment:$('mafComment').value};
    const d=await api(`/object-photo-points/dpsp/sites/${current.point_id}/maf`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const file=$('mafPhoto').files[0];
    if(file)await api(`/object-photo-points/dpsp/maf/${d.id}/photo`,{method:'PUT',headers:{'Content-Type':file.type||'image/jpeg','X-Photo-Filename':encodeURIComponent(file.name)},body:file});
    await refresh();$('detailState').textContent='МАФ добавлен';
  }catch(x){$('detailState').textContent=x.message;$('detailState').className='save-state err'}
}
async function editMaf(item){
  if(!item)return;
  const slot=document.querySelector(`[data-edit-slot="${item.id}"]`);
  if(!slot)return;
  if(slot.innerHTML){slot.innerHTML='';return}
  const types=(dictionaries||{types:[]}).types;
  slot.innerHTML=`<form class="maf-form" style="margin-top:8px" data-form="${esc(item.id)}">
    <div class="field"><label>Тип</label><select data-f="type_code">${types.map(t=>`<option value="${esc(t.code)}" ${t.code===item.type_code?'selected':''}>${esc(t.label)}</option>`).join('')}</select></div>
    <div class="field"><label>Кол-во</label><input data-f="quantity" type="number" min="1" max="999" value="${esc(item.quantity)}"></div>
    <div class="field"><label>Состояние</label><select data-f="condition">${['ok','repair','broken'].map(c=>`<option value="${c}" ${c===item.condition?'selected':''}>${({ok:'Исправно',repair:'Требует ремонта',broken:'Неисправно'})[c]}</option>`).join('')}</select></div>
    <div class="field"><label>Комментарий</label><input data-f="comment" maxlength="2000" value="${esc(item.comment||'')}"></div>
    <button class="btn primary" type="submit">Сохранить</button> <button class="btn" type="button" data-cancel>Отмена</button>
  </form>`;
  slot.querySelector('form').onsubmit=async e=>{
    e.preventDefault();$('detailState').textContent='Сохраняем…';
    const form=e.target,pick=name=>form.querySelector(`[data-f="${name}"]`).value;
    try{
      await api(`/object-photo-points/dpsp/maf/${item.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({type_code:pick('type_code'),quantity:Number(pick('quantity')||1),condition:pick('condition'),comment:pick('comment')})});
      await openSite(current.point_id);await loadSummary();$('detailState').textContent='Изменения сохранены';
    }catch(x){$('detailState').textContent=x.message;$('detailState').className='save-state err'}
  };
  slot.querySelector('[data-cancel]').onclick=()=>slot.innerHTML='';
}
async function deleteMaf(id){
  if(!confirm('Удалить МАФ из оцифровки? История сохранится.'))return;
  $('detailState').textContent='Удаляем…';
  try{
    await api(`/object-photo-points/dpsp/maf/${id}`,{method:'DELETE'});
    await openSite(current.point_id);await loadSummary();$('detailState').textContent='МАФ удалён';
  }catch(x){$('detailState').textContent=x.message;$('detailState').className='save-state err'}
}
async function uploadPhoto(id,file){
  if(!file)return;
  $('detailState').textContent='Загружаем фото…';
  try{
    await api(`/object-photo-points/dpsp/maf/${id}/photo`,{method:'PUT',headers:{'Content-Type':file.type||'image/jpeg','X-Photo-Filename':encodeURIComponent(file.name)},body:file});
    await openSite(current.point_id);$('detailState').textContent='Фото загружено';
  }catch(x){$('detailState').textContent=x.message;$('detailState').className='save-state err'}
}
$('loginForm').onsubmit=login;
$('logout').onclick=logout;
$('refresh').onclick=()=>refresh().catch(x=>{$('saveState').className='chip err';$('saveState').textContent=x.message});
$('apply').onclick=()=>loadSites().catch(x=>{$('saveState').className='chip err';$('saveState').textContent=x.message});
$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();loadSites().catch(x=>{$('saveState').textContent=x.message})}});
(async function boot(){
  if(!token){showLogin();return}
  try{
    const me=await api('/auth/me');
    if(!me.user){showLogin();return}
    showApp(me.user);await refresh();
  }catch(x){showLogin(x.message)}
})();
</script>
</body>
