<script>

const list=document.getElementById('list'), search=document.getElementById('search'), district=document.getElementById('district'), count=document.getElementById('count'), detail=document.getElementById('detail'), frame=document.getElementById('ymap');
let view='special';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
const parseCoord=s=>{const m=String(s||'').match(/(-?\d+(?:\.\d+)?)[,; ]+(-?\d+(?:\.\d+)?)/);return m?[+m[1],+m[2]]:null};
const parentsFor=special;
function zoomTo(lat,lon){const url='https://yandex.ru/map-widget/v1/?um=constructor%3Aa13871ea5b85c93aa369437da513027b074b310c5bf6937fd0e4f1535f71a323&source=constructor&ll='+encodeURIComponent(lon+','+lat)+'&z=17&refresh='+Date.now();frame.src=url}
function openSpecial(x){zoomTo(x.lat,x.lon);detail.innerHTML='<h2>'+x.number+'. '+esc(x.name)+'</h2><p><b>Родительский объект:</b> '+esc(x.parent)+'</p><p><b>Тип:</b> '+esc(x.kind)+' · <b>Район:</b> '+esc(x.district)+'</p><p><b>Балансодержатель:</b> '+esc(x.holder)+'</p><p><b>Координаты:</b> '+x.lat.toFixed(6)+', '+x.lon.toFixed(6)+'</p><p><b>Площадь:</b> '+new Intl.NumberFormat('ru-RU').format(x.area)+' м²</p><p><b>Итого по расчёту:</b> '+money(x.area*(x.smrRate+x.pirRate))+'</p><button onclick="document.getElementById(\'detail\').classList.remove(\'show\')">Закрыть карточку</button>';detail.classList.add('show')}

function fillDistricts(){const data=view==='special'?special:all;const names=[...new Set(data.map(x=>view==='special'?x.district:x.holder).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));district.innerHTML='<option value="">Все '+(view==='special'?'районы':'балансодержатели')+'</option>'+names.map(n=>'<option>'+esc(n)+'</option>').join('')}
function render(){const isSpecial=view==='special';const data=isSpecial?special:all;const q=search.value.trim().toLocaleLowerCase('ru');const d=district.value;const filtered=data.filter(x=>{const area=isSpecial?x.district:x.holder;const text=isSpecial?[x.number,x.name,x.parent,x.district,x.holder,x.kind].join(' '):[x.number,x.parent,x.parentId,x.holder,x.category,x.id,x.coords].join(' ');return(!d||area===d)&&(!q||text.toLocaleLowerCase('ru').includes(q))});
count.textContent='Показано '+filtered.length+' из '+data.length+(isSpecial?' объектов':' отметок');
list.innerHTML=filtered.map(x=>{const num=isSpecial?x.number:x.number;const title=isSpecial?x.name:x.parent;const meta=isSpecial?'Родитель: '+x.parent+' · '+x.district+' · '+x.area+' м²':'Родитель ID: '+(x.parentId||'—')+' · '+(x.coords||'координаты в таблице отсутствуют');const tag=isSpecial?x.kind:(x.category||'');return '<article class="row" data-num="'+esc(num)+'"><div class="rowtop"><div class="num">'+esc(num)+'</div><div class="rowtitle">'+esc(title)+'</div></div><div class="rowmeta">'+esc(meta)+'</div>'+(tag?'<div class="pill">'+esc(tag)+'</div>':'')+'</article>'}).join('')||'<div class="help" style="padding:18px">Ничего не найдено.</div>';
[...list.querySelectorAll('.row')].forEach((el,i)=>el.addEventListener('click',()=>isSpecial?openSpecial(filtered[i]):openAll(filtered[i])))}

search.addEventListener('input',render);district.addEventListener('change',render);fillDistricts();render();
</script></body></html>
