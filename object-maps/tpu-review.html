<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Кабинет приёмки · ТПУ и парковки</title>
  <style>
    :root{--ink:#183c35;--muted:#687873;--line:#d9e0da;--paper:#f5f5ef;--panel:#fff;--green:#0c7a5a;--green-soft:#e7f3ed;--red:#d7193f;--red-soft:#fdecef;--blue:#2a6fdb;--amber:#d99a00}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "Segoe UI",Arial,sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    [hidden]{display:none!important}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 22px;background:#123a32;color:#fff}
    .topbar h1{margin:0;font-size:18px}
    .topbar .subtitle{font-size:12px;color:#c5d8d1}
    .topbar a{color:#d5eadc;font-weight:700;text-decoration:none}
    main{max-width:1280px;margin:0 auto;padding:18px 16px 40px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
    .login{max-width:380px;margin:40px auto;display:grid;gap:8px}
    .login input{padding:10px;border:1px solid #cbd9ce;border-radius:8px}
    .primary{padding:10px 14px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:700}
    .secondary{padding:8px 12px;border:1px solid #9fb3aa;border-radius:9px;background:#fff;color:var(--ink);font-weight:600}
    .danger{padding:8px 12px;border:1px solid #e3a9b5;border-radius:9px;background:var(--red-soft);color:#8c1027;font-weight:700}
    .status{font-size:13px;color:var(--muted)}
    .error{color:#8c1027}
    .counts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
    .count{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
    .count strong{display:block;font-size:24px;line-height:1.1}
    .count span{font-size:12px;color:var(--muted)}
    .count-review strong{color:var(--blue)}.count-rework strong{color:var(--red)}.count-closed strong{color:var(--green)}.count-progress strong{color:var(--amber)}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
    .toolbar label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
    .toolbar select{min-width:190px;padding:8px;border:1px solid #cbd9ce;border-radius:8px;background:#fff}
    .tabs{display:flex;gap:6px;margin-left:auto}
    .tab{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:700;color:var(--muted)}
    .tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
    .card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .card .photo{display:block;aspect-ratio:4/3;background:#e9eee9;color:var(--muted);font-size:12px;text-align:center}
    .card .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .card .photo.placeholder{display:grid;place-items:center}
    .card.rework .photo img{filter:grayscale(.6);opacity:.75}
    .card .body{display:grid;gap:6px;padding:10px 12px 12px}
    .card h3{margin:0;font-size:14px;line-height:1.3}
    .meta{font-size:12px;color:var(--muted)}
    .chip{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:11px;font-weight:800}
    .comment{margin:0;padding:7px 9px;border-radius:8px;background:var(--red-soft);color:#8c1027;font-size:13px;white-space:pre-wrap}
    .actions{display:flex;gap:6px;flex-wrap:wrap}
    .actions .primary,.actions .danger{flex:1}
    .reject-form{display:grid;gap:6px}
    .reject-form textarea{width:100%;min-height:70px;padding:8px;border:1px solid #e3a9b5;border-radius:8px;resize:vertical}
    .card a.map-link{font-size:12px;color:var(--green);font-weight:700}
    .empty{padding:30px;text-align:center;color:var(--muted)}
    .more{display:block;margin:16px auto 0}
    .session{display:flex;align-items:center;gap:10px;font-size:12px}
    .objects{display:grid;gap:8px}
    .object-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:left;color:var(--ink)}
    .object-row:hover{border-color:var(--green);box-shadow:0 4px 14px #163b3014}
    .object-row strong{display:block;font-size:14px}
    .object-row .open{color:var(--green);font-weight:700;white-space:nowrap}
    .pill{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:800;color:#fff}
    .pill.review{background:var(--blue)}.pill.rework{background:var(--red)}.pill.accepted{background:var(--green)}.pill.empty{background:#9aa8a3}
    .object-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
    .object-head h2{margin:4px 0 2px;font-size:18px}
    .slot-empty-box{display:grid;place-items:center;height:70px;background:#eef1ee;color:var(--muted);font-size:13px}
    @media(max-width:800px){.counts{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{margin-left:0}.toolbar select{min-width:0;width:100%}.toolbar label{flex:1 1 100%}}
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Кабинет приёмки · ТПУ и парковки</h1>
      <div class="subtitle">Фото по заданию от районов и АвД САО: принять или вернуть на доработку с комментарием</div>
    </div>
    <div class="session"><span id="sessionInfo"></span><button class="primary" id="slotReport" type="button" hidden>Excel: свод по фото</button><button class="secondary" id="logout" type="button" hidden>Выйти</button><a href="tpu-parking.html">Карта ТПУ и парковок →</a></div>
  </header>
  <main>
    <form class="panel login" id="loginForm" hidden>
      <strong>Вход префектуры</strong>
      <span class="status">Принимать и отклонять фото может только учётная запись префектуры.</span>
      <input id="loginName" autocomplete="username" placeholder="Логин" required>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Пароль" required>
      <button class="primary" type="submit">Войти</button>
      <span class="status" id="loginStatus" role="status"></span>
    </form>
    <section id="workspace" hidden>
      <div class="counts" id="counts"></div>
      <div class="toolbar">
        <label>Район<select id="districtFilter"><option value="">Все районы и АвД САО</option></select></label>
        <label>Вид объекта<select id="kindFilter"><option value="">Все объекты</option><option value="tpu">ТПУ</option><option value="parking">Автомобильные парковки</option><option value="pocket">Парковочные карманы</option></select></label>
        <div class="tabs" role="tablist">
          <button class="tab active" type="button" data-tab="pending" role="tab">На проверке</button>
          <button class="tab" type="button" data-tab="rework" role="tab">На доработке</button>
        </div>
      </div>
      <p class="status" id="listStatus" role="status"></p>
      <div class="objects" id="list"></div>
      <button class="secondary more" id="more" type="button" hidden>Показать ещё</button>
    </section>
    <section id="objectView" hidden>
      <div class="object-head">
        <div><button class="secondary" id="backToList" type="button">← К списку объектов</button><h2 id="objectTitle"></h2><div class="meta" id="objectMeta"></div></div>
        <div class="actions"><button class="primary" id="acceptAll" type="button">Принять все фото на проверке</button><a class="secondary" id="objectMapLink" target="_blank">Объект на карте →</a></div>
      </div>
      <p class="status" id="objectStatus" role="status"></p>
      <div class="grid" id="slotGrid"></div>
    </section>
  </main>
  <script src="../odh-map/api-config.js"></script><script>if (["127.0.0.1", "localhost"].includes(location.hostname)) ODHApi.setBase("http://127.0.0.1:8789");</script><script src="tpu-photo-api.js"></script>
  <script>
  (() => {
    'use strict';
    const api = window.TpuPhotoApi || window.ODHApi;
    const endpoint = '/api/object-photo-points/slots';
    const PAGE = 24;
    const el = (id) => document.getElementById(id);
    const make = (tag, className, text) => { const node = document.createElement(tag); if (className) node.className = className; if (text != null) node.textContent = text; return node; };
    const state = { queue: null, tab: 'pending', shown: PAGE, urls: [], object: null };
    const kindOf = (object) => object.kind === 'tpu' ? 'tpu' : object.type === 'Парковочный карман' ? 'pocket' : 'parking';
    const when = (value) => value ? new Date(value).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';

    async function json(path, options) { return (await api.request(endpoint + path, options)).json(); }
    function setStatus(id, text, error = false) { el(id).textContent = text; el(id).classList.toggle('error', error); }
    function clearUrls() { state.urls.forEach(URL.revokeObjectURL); state.urls = []; }

    function showSession() {
      const user = api.user();
      const prefecture = user?.role === 'prefecture_admin';
      el('loginForm').hidden = prefecture;
      el('workspace').hidden = !prefecture || !!state.object;
      el('objectView').hidden = !prefecture || !state.object;
      el('logout').hidden = !user;
      el('slotReport').hidden = !prefecture;
      el('sessionInfo').textContent = user ? (user.email || '') + (prefecture ? ' · Префектура' : ' · нет прав приёмки') : '';
      if (user && !prefecture) el('loginStatus').textContent = 'Эта учётная запись не может принимать фото. Войдите учётной записью префектуры.';
      if (prefecture) load();
    }

    async function load() {
      setStatus('listStatus', 'Загружаем очередь…');
      try {
        state.queue = await json('/queue');
        fillDistricts();
        renderCounts();
        render();
      } catch (error) { setStatus('listStatus', 'Не удалось загрузить очередь: ' + error.message, true); }
    }

    function fillDistricts() {
      const select = el('districtFilter');
      const current = select.value;
      const groups = new Set([...state.queue.pending, ...state.queue.rework].map((row) => row.object.group));
      select.replaceChildren(new Option('Все районы и АвД САО', ''));
      for (const group of [...groups].sort((a, b) => a.localeCompare(b, 'ru'))) select.append(new Option(group, group));
      select.value = groups.has(current) ? current : '';
    }

    function renderCounts() {
      const c = state.queue.counts;
      const objects = (rows) => new Set(rows.map((r) => r.object.id)).size;
      const items = [
        ['review', objects(state.queue.pending), `объектов на проверке · ${state.queue.pending.length} фото`],
        ['rework', objects(state.queue.rework), `объектов на доработке · ${state.queue.rework.length} слотов`],
        ['closed', c.closed, 'объектов закрыто'],
        ['progress', c.progress, 'объектов в работе (не все слоты)'],
        ['empty', c.empty, 'объектов без фото'],
      ];
      el('counts').replaceChildren(...items.map(([key, value, label]) => {
        const box = make('div', 'count count-' + key);
        box.append(make('strong', '', Number(value).toLocaleString('ru-RU')), make('span', '', label));
        return box;
      }));
    }

    // Объекты вкладки: фото на проверке (или слоты на доработке) сгруппированы по объекту.
    function objectRows() {
      const district = el('districtFilter').value;
      const kind = el('kindFilter').value;
      const groups = new Map();
      for (const row of state.queue[state.tab]) {
        if ((district && row.object.group !== district) || (kind && kindOf(row.object) !== kind)) continue;
        if (!groups.has(row.object.id)) groups.set(row.object.id, { object: row.object, rows: [] });
        groups.get(row.object.id).rows.push(row);
      }
      const first = (g) => Math.min(...g.rows.map((r) => new Date(r.uploaded_at).getTime()));
      return [...groups.values()].sort((a, b) => state.tab === 'pending' ? first(a) - first(b) : first(b) - first(a));
    }

    function render() {
      const list = el('list');
      const all = objectRows();
      const shown = all.slice(0, state.shown);
      setStatus('listStatus', all.length ? `Объектов: ${all.length.toLocaleString('ru-RU')}` + (state.tab === 'pending' ? ' · сначала те, что ждут дольше всех' : '') : '');
      list.replaceChildren(...shown.map((group) => {
        const row = make('button', 'object-row'); row.type = 'button';
        const info = make('div');
        const pill = make('span', 'pill ' + (state.tab === 'pending' ? 'review' : 'rework'), state.tab === 'pending' ? `на проверке: ${group.rows.length}` : `на доработке: ${group.rows.length}`);
        const meta = make('div', 'meta', `${group.object.group} · ${group.object.type} · слотов по заданию: ${group.object.required} · ` + (state.tab === 'pending' ? 'первое фото ' : 'отклонено ') + when(state.tab === 'pending' ? group.rows[0].uploaded_at : group.rows[0].reviewed_at));
        info.append(make('strong', '', group.object.label), meta);
        meta.prepend(pill);
        row.append(info, make('span', 'open', 'Открыть объект →'));
        row.onclick = () => openObject(group.object);
        return row;
      }));
      if (!all.length) list.append(make('div', 'empty', state.tab === 'pending' ? 'Нет объектов с фото на проверке.' : 'Нет объектов на доработке.'));
      el('more').hidden = shown.length >= all.length;
    }

    function photoBox(photo, label) {
      const box = make('a', 'photo placeholder', 'Загружаем фото…');
      box.target = '_blank'; box.rel = 'noopener';
      api.request(endpoint + '/photos/' + photo.id).then((response) => response.blob()).then((blob) => {
        const url = URL.createObjectURL(blob); state.urls.push(url);
        const image = make('img'); image.src = url; image.alt = label;
        box.href = url; box.classList.remove('placeholder'); box.replaceChildren(image);
      }).catch(() => { box.textContent = 'Фото не открылось'; });
      return box;
    }

    async function openObject(object) {
      state.object = object;
      el('workspace').hidden = true; el('objectView').hidden = false;
      el('objectTitle').textContent = object.label;
      el('objectMeta').textContent = `${object.group} · ${object.type} · слотов по заданию: ${object.required}`;
      el('objectMapLink').href = 'tpu-parking.html?object=' + encodeURIComponent(object.id);
      window.scrollTo({ top: 0 });
      await renderObject();
    }

    async function renderObject() {
      clearUrls();
      const grid = el('slotGrid');
      grid.replaceChildren();
      setStatus('objectStatus', 'Загружаем слоты…');
      let detail;
      try { detail = await json('/objects/' + encodeURIComponent(state.object.id)); }
      catch (error) { setStatus('objectStatus', 'Не удалось открыть объект: ' + error.message, true); return; }
      const labels = { empty: 'Нет фото', progress: 'В работе', review: 'На проверке', rework: 'На доработке', closed: 'Закрыта' };
      setStatus('objectStatus', `Статус объекта: ${labels[detail.status]} · принято ${detail.accepted} из ${detail.required}`);
      const pending = detail.slots.filter((s) => s.photo?.status === 'pending');
      el('acceptAll').hidden = pending.length < 2;
      el('acceptAll').onclick = async () => {
        if (!confirm(`Принять все ${pending.length} фото этого объекта, которые на проверке?`)) return;
        el('acceptAll').disabled = true;
        try { for (const slot of pending) await json('/photos/' + slot.photo.id + '/review', { method: 'POST', body: JSON.stringify({ decision: 'accepted', comment: '' }) }); }
        catch (error) { setStatus('objectStatus', 'Не удалось принять: ' + error.message, true); }
        el('acceptAll').disabled = false;
        await renderObject();
      };
      grid.replaceChildren(...detail.slots.map((slot) => slotCard(slot)));
    }

    function slotCard(slot) {
      const node = make('article', 'card' + (slot.rejected ? ' rework' : ''));
      const body = make('div', 'body');
      const title = make('h3', '', 'Слот ' + slot.slot + ' ');
      body.append(title);
      if (slot.photo) {
        const accepted = slot.photo.status === 'accepted';
        title.append(make('span', 'pill ' + (accepted ? 'accepted' : 'review'), accepted ? 'Принято' : 'На проверке'));
        body.append(make('div', 'meta', 'Загружено ' + when(slot.photo.uploaded_at) + (accepted ? ' · принято ' + when(slot.photo.reviewed_at) : '')));
        node.append(photoBox(slot.photo, 'Слот ' + slot.slot), body);
        const actions = make('div', 'actions');
        const reject = make('button', 'danger', 'Отклонить'); reject.type = 'button';
        if (!accepted) { const accept = make('button', 'primary', 'Принять'); accept.type = 'button'; accept.onclick = () => decide(slot.photo, 'accepted', '', [accept, reject]); actions.append(accept); }
        actions.append(reject);
        const form = make('form', 'reject-form'); form.hidden = true;
        const comment = make('textarea'); comment.placeholder = 'Что не так и что исправить — комментарий увидит район'; comment.maxLength = 2000; comment.required = true;
        const send = make('button', 'danger', 'Отправить на доработку'); send.type = 'submit';
        const cancel = make('button', 'secondary', 'Отмена'); cancel.type = 'button';
        const formActions = make('div', 'actions'); formActions.append(send, cancel);
        form.append(comment, formActions);
        reject.onclick = () => { form.hidden = false; actions.hidden = true; comment.focus(); };
        cancel.onclick = () => { form.hidden = true; actions.hidden = false; };
        form.onsubmit = (event) => { event.preventDefault(); const text = comment.value.trim(); if (text) decide(slot.photo, 'rejected', text, [send, cancel]); };
        body.append(actions, form);
      } else if (slot.rejected) {
        title.append(make('span', 'pill rework', 'На доработке'));
        node.append(photoBox(slot.rejected, 'Отклонённое фото, слот ' + slot.slot), body);
        body.append(make('p', 'comment', 'Что исправить: ' + slot.rejected.review_comment), make('div', 'meta', 'Отклонено ' + when(slot.rejected.reviewed_at) + '. Ждём новое фото от района.'));
      } else {
        title.append(make('span', 'pill empty', 'Нет фото'));
        node.append(make('div', 'slot-empty-box', 'Район ещё не загрузил фото'), body);
      }
      return node;
    }

    async function decide(photo, decision, comment, buttons) {
      buttons.forEach((b) => { b.disabled = true; });
      try {
        await json('/photos/' + photo.id + '/review', { method: 'POST', body: JSON.stringify({ decision, comment }) });
        await renderObject();
        setStatus('objectStatus', (decision === 'accepted' ? 'Фото принято. ' : 'Фото отклонено, слот отправлен на доработку. ') + el('objectStatus').textContent);
      } catch (error) {
        buttons.forEach((b) => { b.disabled = false; });
        setStatus('objectStatus', 'Не удалось сохранить решение: ' + error.message, true);
      }
    }

    el('backToList').onclick = async () => {
      state.object = null; clearUrls();
      el('objectView').hidden = true; el('workspace').hidden = false;
      await load();
    };
    el('loginForm').onsubmit = async (event) => {
      event.preventDefault();
      el('loginStatus').textContent = 'Входим…';
      try { await api.login(el('loginName').value.trim(), el('loginPassword').value); el('loginPassword').value = ''; el('loginStatus').textContent = ''; showSession(); }
      catch (error) { el('loginStatus').textContent = 'Вход не выполнен: ' + error.message; }
    };
    // Свод Excel по фото в слотах — выгружает только префектура.
    el('slotReport').onclick = async () => {
      const button = el('slotReport');
      button.disabled = true; button.textContent = 'Готовим свод…';
      try {
        const response = await api.request(endpoint + '/report.xlsx');
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement('a');
        link.href = url; link.download = 'Svod_foto_TPU_parkovki_' + new Date().toISOString().slice(0, 10) + '.xlsx';
        document.body.append(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      } catch (error) { setStatus('listStatus', 'Не удалось получить свод: ' + error.message, true); }
      finally { button.disabled = false; button.textContent = 'Excel: свод по фото'; }
    };
    el('logout').onclick = () => { api.clearSession(); state.queue = null; state.object = null; el('list').replaceChildren(); showSession(); };
    el('districtFilter').onchange = el('kindFilter').onchange = () => { state.shown = PAGE; render(); };
    el('more').onclick = () => { state.shown += PAGE; render(); };
    document.querySelectorAll('.tab').forEach((tab) => {
      tab.onclick = () => {
        state.tab = tab.dataset.tab; state.shown = PAGE;
        document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
        render();
      };
    });
    showSession();
  })();
  </script>
</body>
</html>
