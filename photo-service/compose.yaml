name: sao-photo-service

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sao_photo_service
      POSTGRES_USER: sao_photo_service
      POSTGRES_PASSWORD: ${PHOTO_SERVICE_DB_PASSWORD:?Set a unique local PHOTO_SERVICE_DB_PASSWORD}
    volumes:
      - photo-service-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  photo-service:
    build:
      context: .
    environment:
      PHOTO_SERVICE_DB_HOST: database
      PHOTO_SERVICE_DB_PORT: 5432
      PHOTO_SERVICE_DB_NAME: sao_photo_service
      PHOTO_SERVICE_DB_USER: sao_photo_service
      PHOTO_SERVICE_DB_PASSWORD: ${PHOTO_SERVICE_DB_PASSWORD:?Set a unique local PHOTO_SERVICE_DB_PASSWORD}
      PHOTO_SERVICE_MEDIA_ROOT: /var/lib/sao-photo-service/media
      PHOTO_SERVICE_ALLOWED_ORIGINS: ${PHOTO_SERVICE_ALLOWED_ORIGINS:-https://hainox.github.io}
      PHOTO_SERVICE_BASE_PATH: ${PHOTO_SERVICE_BASE_PATH:-}
      PHOTO_SERVICE_COOKIE_SECURE: ${PHOTO_SERVICE_COOKIE_SECURE:-false}
      PHOTO_SERVICE_COOKIE_PATH: ${PHOTO_SERVICE_COOKIE_PATH:-/photo-api}
      PHOTO_SERVICE_COOKIE_SAMESITE: ${PHOTO_SERVICE_COOKIE_SAMESITE:-lax}
      NOTIFY_URL: ${NOTIFY_URL:-http://sao-notify:8790}
      NOTIFY_SECRET: ${NOTIFY_SECRET:-}
      # Ежечасная сводка штаба картинкой в Telegram.
      PHOTO_SERVICE_DIGEST_ENABLED: ${PHOTO_SERVICE_DIGEST_ENABLED:-false}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PHOTO_SERVICE_HOST_PORT:-8788}:8788"
    volumes:
      - photo-service-media:/var/lib/sao-photo-service/media
    networks:
      default: {}
      edge:
        aliases:
          - sao-photo-service-api
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

volumes:
  photo-service-postgres-data:
  photo-service-media:

networks:
  edge:
    name: sao-photo-service-edge
    external: true
