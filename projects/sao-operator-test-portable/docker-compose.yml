services:
  operator-test:
    build:
      context: .
    image: sao-operator-test:local
    environment:
      HOST: 0.0.0.0
      PORT: 8765
    ports:
      - "${OPERATOR_PORT:-8765}:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
