<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Кабинет приёмки фотофиксации · САО</title>
  <style>
    :root{--ink:#18352e;--muted:#6d7e77;--line:#dce7e0;--paper:#f4f7f4;--panel:#fff;--brand:#0c735b;--brand-soft:#e7f4ee;--warn:#a75022;--warn-soft:#fff0e7;--shadow:0 12px 34px #163b3020}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}.top{min-height:72px;background:#123d33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top h1{font-size:20px;margin:0}.top p{margin:3px 0 0;color:#c6ddd4;font-size:12px}.top button{border:1px solid #b9ddd0;background:#dcefe7;color:#164b3e;border-radius:9px;padding:9px 13px;font-weight:700}.app{max-width:1480px;margin:auto;padding:22px}.filters{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr auto;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);align-items:end}.field label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin:0 0 5px}.field input,.field select,.comment{width:100%;border:1px solid #cbd8cf;border-radius:8px;background:#fff;padding:10px;color:var(--ink)}.sync{height:40px;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:0 15px;font-weight:700}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted);font-size:12px}.chip b{color:var(--ink);margin-right:4px}.layout{display:grid;grid-template-columns:minmax(300px,410px) 1fr;gap:14px;min-height:650px}.queue,.detail{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.queue-head{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.queue-list{max-height:700px;overflow:auto;padding:8px}.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:#fff;border-radius:10px;padding:12px;margin:2px 0;color:var(--ink);cursor:pointer}.item:hover,.item.active{background:#f2f8f4;border-color:#b9d9c7}.item strong{display:block;font-size:13px}.item small{display:block;color:var(--muted);margin-top:3px}.badge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:700;margin-top:8px;background:#edf1ee;color:#5e7068}.badge.ok{background:var(--brand-soft);color:var(--brand)}.badge.rework{background:var(--warn-soft);color:var(--warn)}.empty{padding:35px 20px;text-align:center;color:var(--muted)}.detail{padding:22px}.detail h2{margin:0 0 4px;font-size:21px}.sub{margin:0;color:var(--muted)}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.meta div{background:#f6f8f5;border-radius:9px;padding:10px}.meta span{display:block;color:var(--muted);font-size:11px}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0 20px}.photo{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#f1f4f0}.photo.ref{outline:3px solid #e6bd65}.photo img{display:block;width:100%;height:185px;object-fit:cover;background:#e9efeb}.photo figcaption{padding:9px 10px 2px;font-size:12px}.photo .reason{padding:5px 10px;color:var(--warn);font-size:12px}.photo-actions{padding:9px 10px 11px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}.photo-actions button{border:1px solid var(--brand);border-radius:7px;background:#fff;color:var(--brand);padding:7px 9px;font-size:12px;font-weight:700}.photo-actions .reject{border-color:#d48752;background:#fff4ec;color:var(--warn)}.photo-actions label{font-size:12px;color:var(--muted);font-weight:600;margin-right:auto}.review{border-top:1px solid var(--line);padding-top:17px}.review h3{font-size:13px;margin:0 0 9px}.comment{min-height:88px;resize:vertical}.notice{margin-top:10px;min-height:20px;color:var(--muted);font-size:12px}.login{position:fixed;inset:0;background:#123d33;display:grid;place-items:center;z-index:3}.login form{width:min(390px,calc(100% - 30px));background:#fff;border-radius:14px;padding:28px;box-shadow:var(--shadow)}.login h2{margin:0 0 6px}.login p{color:var(--muted);font-size:12px}.login .field{margin-top:12px}.login button{width:100%;margin-top:15px;padding:11px;background:var(--brand);border:0;border-radius:8px;color:#fff;font-weight:700}.hidden{display:none!important}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.queue-list{max-height:330px}.top{padding:0 15px}.app{padding:12px}.meta{grid-template-columns:1fr 1fr}}@media(max-width:520px){.filters,.meta{grid-template-columns:1fr}.top h1{font-size:17px}}
  </style>
<style>.photo img{height:auto;max-height:520px;object-fit:contain}</style>
</head>
<body>
  <div class="login" id="login"><form id="loginForm"><h2>Кабинет приёмки</h2><p>Проверка фото объектов САО. Доступ только для префектуры.</p><div class="field"><label for="email">Логин</label><input id="email" required autocomplete="username"></div><div class="field"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"></div><button>Войти</button><div class="notice" id="loginMsg"></div></form></div>
  <header class="top"><div><h1>Приёмка фотофиксации · САО</h1><p id="userLine">Общая очередь объектов</p></div><button id="logout" type="button">Выйти</button></header>
  <main class="app"><section class="filters"><div class="field"><label for="search">Поиск</label><input id="search" placeholder="Адрес или ID объекта"></div><div class="field"><label for="district">Район</label><select id="district"><option value="">Все районы</option></select></div><div class="field"><label for="workType">Вид работ</label><select id="workType"><option value="">Все виды</option><option value="stop">Остановки</option><option value="pp">ПП</option><option value="entrance">Подъезды</option></select></div><div class="field"><label for="status">Очередь</label><select id="status"><option value="pending">На проверку</option><option value="rework">На доработку</option><option value="approved">Принятые</option><option value="">Все статусы</option></select></div><button class="sync" id="sync" type="button">Обновить</button></section><div class="summary"><span class="chip"><b id="pendingCount">0</b>на проверку</span><span class="chip"><b id="approvedCount">0</b>принято</span><span class="chip"><b id="reworkCount">0</b>на доработке</span><span class="chip" id="saveState">Статус сохраняется сразу</span></div><section class="layout"><aside class="queue"><div class="queue-head"><strong>Объекты</strong><span id="queueCount">0</span></div><div class="queue-list" id="queue"></div></aside><article class="detail" id="detail"><div class="empty">Выберите объект слева</div></article></section></main>
  <script>
    const API=(new URLSearchParams(location.search).get('api')||localStorage.getItem('saoPhotoApi')||'https://obhod-sao.ru/photo-api').replace(/\/$/,'');let token=localStorage.getItem('saoPhotoToken')||'',objects=[],visible=[],selected=null;
    const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const typeName=t=>t==='stop'?'Остановки':t==='pp'?'ПП':'Подъезды';
    const photos=o=>Array.isArray(o.photos)?o.photos:[];
    const statusOf=o=>{const p=photos(o);if(p.some(x=>x.reviewStatus==='pending_review'))return'pending';if(p.some(x=>x.reviewStatus==='rejected'))return'rework';if(p.some(x=>x.reviewStatus==='confirmed'))return'approved';return'empty'};
    function headers(extra={}){return Object.assign({'Authorization':'Bearer '+token},extra)}
    async function api(path,opts={}){const r=await fetch(API+path,Object.assign({credentials:'include',headers:headers()},opts));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'Не удалось выполнить запрос');return d}
    async function login(e){e.preventDefault();$('loginMsg').textContent='Выполняется вход…';try{const d=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('email').value,email:$('email').value,password:$('password').value})});token=d.token;localStorage.setItem('saoPhotoToken',token);localStorage.setItem('saoPhotoApi',API);$('login').classList.add('hidden');$('userLine').textContent=(d.user.displayName||d.user.email)+' · Префектура';await load()}catch(x){$('loginMsg').textContent=x.message}}
    async function load(){try{$('saveState').textContent='Загружаем очередь…';const q=new URLSearchParams();if($('district').value)q.set('district',$('district').value);const d=await api('/review/queue?'+q);objects=d.objects||[];const districts=[...new Set(objects.map(x=>x.district).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));const current=$('district').value;$('district').innerHTML='<option value="">Все районы</option>'+districts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('district').value=current;render();$('saveState').textContent='Статус сохраняется сразу'}catch(x){$('saveState').textContent=x.message}}
    function filtered(){const query=$('search').value.toLocaleLowerCase('ru').trim(),district=$('district').value,type=$('workType').value,status=$('status').value;return objects.filter(o=>{const s=statusOf(o),text=`${o.objectKey} ${o.label||''} ${o.district||''}`.toLocaleLowerCase('ru');return(!query||text.includes(query))&&(!district||o.district===district)&&(!type||o.objectType===type)&&(!status||s===status)&&s!=='empty'})}
    function render(){visible=filtered();const all=objects.filter(o=>statusOf(o)!=='empty');$('pendingCount').textContent=all.filter(o=>statusOf(o)==='pending').length;$('approvedCount').textContent=all.filter(o=>statusOf(o)==='approved').length;$('reworkCount').textContent=all.filter(o=>statusOf(o)==='rework').length;$('queueCount').textContent=visible.length;$('queue').innerHTML=visible.length?visible.map(o=>{const s=statusOf(o);return`<button class="item ${selected?.objectKey===o.objectKey?'active':''}" data-key="${esc(o.objectKey)}"><strong>${esc(o.label||o.objectKey)}</strong><small>${esc(o.district||'Район не указан')} · ${typeName(o.objectType)} · ${photos(o).length} фото</small><span class="badge ${s==='approved'?'ok':s==='rework'?'rework':''}">${s==='approved'?'Принят':s==='rework'?'На доработке':'На проверку'}</span></button>`}).join(''):'<div class="empty">В этой очереди нет объектов</div>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>open(b.dataset.key))}
    async function hydrate(){for(const image of document.querySelectorAll('[data-photo-id]')){try{const r=await fetch(`${API}/photos/${encodeURIComponent(image.dataset.photoId)}/content`,{headers:headers()});if(!r.ok)throw Error();image.src=URL.createObjectURL(await r.blob())}catch(_){image.alt='Фото недоступно'}}}
    async function open(key){selected=objects.find(o=>o.objectKey===key);if(!selected)return;const p=photos(selected);const s=statusOf(selected);$('detail').innerHTML=`<h2>${esc(selected.label||selected.objectKey)}</h2><p class="sub">${esc(selected.objectKey)} · ${esc(selected.district||'Район не указан')} · ${typeName(selected.objectType)}</p><div class="meta"><div><span>Статус</span><b>${s==='approved'?'Принят':s==='rework'?'На доработке':'На проверку'}</b></div><div><span>Фотографий</span><b>${p.length}</b></div><div><span>Подтверждено</span><b>${p.filter(x=>x.reviewStatus==='confirmed').length}</b></div><div><span>Точек источника</span><b>${selected.sourcePointCount||selected.sourceIds?.length||'—'}</b></div></div><h3>Фото объекта</h3><div class="photos">${p.length?p.map(x=>`<figure class="photo ${x.isReference?'ref':''}"><img data-photo-id="${esc(x.id)}" alt="Фото ${esc(selected.label||selected.objectKey)}"><figcaption>${x.reviewStatus==='confirmed'?'Подтверждено':x.reviewStatus==='rejected'?'На доработке':'На проверку'}${x.isReference?' · Эталонное фото':''}</figcaption>${x.reviewReason?`<div class="reason">Причина: ${esc(x.reviewReason)}</div>`:''}${x.reviewStatus!=='confirmed'?`<div class="photo-actions"><label><input type="checkbox" data-reference="${esc(x.id)}" ${x.isReference?'checked':''}> Сделать эталонным</label><button data-approve="${esc(x.id)}">Принять</button><button class="reject" data-reject="${esc(x.id)}">На доработку</button></div>`:''}</figure>`).join(''):'<div class="empty">Фото ещё не загружены</div>'}</div><div class="review"><label for="comment">Комментарий к возврату</label><textarea class="comment" id="comment" maxlength="1000" placeholder="Укажите причину, если возвращаете фото на доработку…"></textarea><div class="notice" id="detailMsg">Для принятого фото объект исчезнет из очереди «На проверку».</div></div>`;document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>review(b.dataset.approve,'confirmed'));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>review(b.dataset.reject,'rejected'));hydrate();render()}
    async function review(id,status){const reason=$('comment').value.trim();if(status==='rejected'&&!reason){$('detailMsg').textContent='Укажите причину возврата на доработку.';return}const check=document.querySelector(`[data-reference="${CSS.escape(id)}"]`);try{$('detailMsg').textContent='Сохраняем решение…';await api(`/photos/${encodeURIComponent(id)}/review`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason,isReference:Boolean(check?.checked)})});const key=selected?.objectKey;await load();if(key&&objects.some(o=>o.objectKey===key)){await open(key)}else{$('detail').innerHTML='<div class="empty"><strong>Решение сохранено</strong><br>Проверенный объект убран из текущей очереди.</div>'}}catch(x){$('detailMsg').textContent=x.message}}
    $('loginForm').onsubmit=login;$('logout').onclick=()=>{localStorage.removeItem('saoPhotoToken');location.reload()};$('sync').onclick=load;$('search').oninput=render;$('district').onchange=load;$('workType').onchange=render;$('status').onchange=render;if(token){$('login').classList.add('hidden');load()}
  </script>
</body>
</html>
